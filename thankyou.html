<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Arosmita</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5eaff, #e8d5ff);
            color: #4b3b5c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(80, 50, 100, 0.15);
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #7b4bb7;
            font-size: 34px;
            margin-bottom: 15px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            margin: 10px 0;
        }

        .little-note {
            margin-top: 25px;
            font-size: 15px;
            color: #806c91;
            font-style: italic;
        }

        .buttons {
            margin-top: 30px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #7b4bb7;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 15px;
            transition: 0.3s;
        }

        a:hover {
            background: #60358f;
        }

        footer {
            margin-top: 35px;
            font-size: 13px;
            color: #9a89a8;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="emoji">🌷</div>

        <h1>Thank You for Visiting!</h1>

        <p>
            Thank you for taking the time to explore my website. 😊
        </p>

        <p>
            I hope you enjoyed learning a little about me
            and exploring my little corner of the web.
        </p>

        <p class="little-note">
            That's all for now... before I decide to add another page! 😄
        </p>

        <div class="buttons">
            <a href="index.html">← Back to Home</a>
        </div>

        <footer>
            Made with 💜 and a little bit of coding.
        </footer>

    </div>

</body>
</html>
